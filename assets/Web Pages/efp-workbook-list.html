<div class="row sectionBlockLayout text-start" style="display: flex; flex-wrap: wrap; margin: 0px; min-height: auto; padding: 8px; background-image: linear-gradient(0deg, rgba(252, 252, 252, 0), rgba(252, 252, 252, 0));">
  <div class="container" style="display: flex; flex-wrap: wrap;">
    <div class="col-lg-12 columnBlockLayout" style="flex-grow: 1; display: flex; flex-direction: column; min-width: 300px; padding: 16px; margin: 0px 0px;">
      <h2 style="color: var(--portalThemeColor4);">​​<b aria-label="Text My EFP Workbooks" style="position: relative;">My EFP Workbooks</b></h2>
    
      {% if user.roles contains 'EFP Producer' %}
          {% include 'entity_list' key: 'EFP Workbook List - Producer View' %}
      {% elsif user.roles contains 'EFP Planning Advisor' %}
          {% include 'entity_list' key: 'EFP Workbook List - Planning Advisor View' %}
      {% endif %}
    </div>
  </div>
</div>
