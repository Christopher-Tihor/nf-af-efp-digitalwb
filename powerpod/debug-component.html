<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug EFP Component Registration</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .debug-section { background: #f5f5f5; padding: 15px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; border: 1px solid #c3e6cb; }
        .error { background: #f8d7da; border: 1px solid #f5c6cb; }
        .warning { background: #fff3cd; border: 1px solid #ffeaa7; }
        pre { background: white; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>EFP Component Registration Debug</h1>
    
    <div id="results"></div>
    
    <div class="debug-section">
        <h3>Test Component</h3>
        <div id="component-container"></div>
    </div>

    <script type="module">
        const results = document.getElementById('results');
        
        function addResult(title, content, type = 'debug-section') {
            const div = document.createElement('div');
            div.className = type;
            div.innerHTML = `<h3>${title}</h3><pre>${content}</pre>`;
            results.appendChild(div);
        }
        
        // Step 1: Check if custom elements are supported
        addResult('Custom Elements Support', 
            `customElements supported: ${!!window.customElements}`, 
            window.customElements ? 'success' : 'error'
        );
        
        // Step 2: Import the component and check registration
        try {
            // Import the built powerpod bundle
            await import('./dist/powerpod.js');
            addResult('Powerpod Bundle Import', 'Successfully imported powerpod.js', 'success');
            
            // Wait a bit for registration
            await new Promise(resolve => setTimeout(resolve, 1000));
            
            // Check if the component is registered
            const isRegistered = customElements.get('efp-entry-form-modular');
            addResult('Component Registration Check', 
                `efp-entry-form-modular registered: ${!!isRegistered}
Constructor: ${isRegistered ? isRegistered.name : 'Not found'}`, 
                isRegistered ? 'success' : 'error'
            );
            
            // List all registered custom elements
            const allCustomElements = [];
            for (let i = 0; i < 1000; i++) {
                try {
                    const element = customElements.get(`test-element-${i}`);
                    if (element) allCustomElements.push(`test-element-${i}`);
                } catch (e) {
                    // Ignore
                }
            }
            
            // Get all custom elements in the registry (this is a hack since there's no direct API)
            const registeredElements = [];
            const originalDefine = customElements.define;
            const originalGet = customElements.get;
            
            // Override get to track what's being checked
            const checkedElements = new Set();
            customElements.get = function(name) {
                checkedElements.add(name);
                return originalGet.call(this, name);
            };
            
            // Check common custom element patterns
            const commonPatterns = [
                'efp-entry-form', 'efp-entry-form-modular',
                'sl-button', 'sl-tab', 'sl-tab-group',
                'navigation-buttons', 'rating-question'
            ];
            
            commonPatterns.forEach(name => {
                const element = customElements.get(name);
                if (element) {
                    registeredElements.push(`${name}: ${element.name}`);
                }
            });
            
            // Restore original get
            customElements.get = originalGet;
            
            addResult('Registered Custom Elements', 
                registeredElements.length > 0 ? 
                registeredElements.join('\n') : 
                'No custom elements found with common patterns'
            );
            
            // Step 3: Try to create the component
            if (isRegistered) {
                try {
                    const component = document.createElement('efp-entry-form-modular');
                    document.getElementById('component-container').appendChild(component);
                    
                    // Wait for component to initialize
                    await new Promise(resolve => setTimeout(resolve, 500));
                    
                    // Check component properties and methods
                    const hasUpdateMethod = typeof component.updateNestedChapterStructure === 'function';
                    const hasProperty = 'nestedChapterStructure' in component;
                    
                    addResult('Component Creation', 
                        `Component created successfully
Tag name: ${component.tagName}
Constructor: ${component.constructor.name}
Has updateNestedChapterStructure method: ${hasUpdateMethod}
Has nestedChapterStructure property: ${hasProperty}
Component connected: ${component.isConnected}`, 
                        'success'
                    );
                    
                    // Try to call the method
                    if (hasUpdateMethod) {
                        try {
                            component.updateNestedChapterStructure([{
                                name: 'Test Chapter',
                                description: 'Test description',
                                questions: [],
                                subchapters: []
                            }]);
                            addResult('Method Call Test', 'updateNestedChapterStructure called successfully', 'success');
                        } catch (error) {
                            addResult('Method Call Test', `Error calling method: ${error.message}`, 'error');
                        }
                    }
                    
                } catch (error) {
                    addResult('Component Creation', `Error creating component: ${error.message}`, 'error');
                }
            } else {
                addResult('Component Creation', 'Cannot create component - not registered', 'error');
            }
            
        } catch (error) {
            addResult('Import Error', `Failed to import powerpod.js: ${error.message}`, 'error');
            console.error('Import error:', error);
        }
    </script>
</body>
</html>
