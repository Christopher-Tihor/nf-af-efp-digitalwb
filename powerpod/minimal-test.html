<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal EFP Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .success { background: #d4edda; }
        .error { background: #f8d7da; }
    </style>
</head>
<body>
    <h1>Minimal EFP Component Test</h1>
    <div id="status"></div>
    <div id="component-area"></div>

    <script>
        const status = document.getElementById('status');
        const componentArea = document.getElementById('component-area');
        
        function updateStatus(message, isSuccess = true) {
            status.innerHTML = `<div class="${isSuccess ? 'success' : 'error'}">${message}</div>`;
            console.log(message);
        }
        
        // Test function
        async function testComponent() {
            try {
                updateStatus('Loading powerpod bundle...');
                
                // Import the powerpod bundle
                await import('./dist/powerpod.js');
                
                updateStatus('Bundle loaded, checking component registration...');
                
                // Wait for registration
                await new Promise(resolve => setTimeout(resolve, 1000));
                
                // Check if component is registered
                const ComponentClass = customElements.get('efp-entry-form-modular');
                if (!ComponentClass) {
                    updateStatus('Component not registered!', false);
                    return;
                }
                
                updateStatus('Component registered! Creating instance...');
                
                // Create component
                const component = document.createElement('efp-entry-form-modular');
                componentArea.appendChild(component);
                
                // Wait for component to be ready
                await new Promise(resolve => setTimeout(resolve, 2000));
                
                updateStatus('Component created! Testing method...');
                
                // Test the method
                if (typeof component.updateNestedChapterStructure === 'function') {
                    const testData = [{
                        name: 'Test Chapter',
                        description: 'This is a test chapter',
                        questions: [],
                        subchapters: []
                    }];
                    
                    component.updateNestedChapterStructure(testData);
                    updateStatus('SUCCESS: Component method called successfully!');
                } else {
                    updateStatus('ERROR: updateNestedChapterStructure method not found!', false);
                    console.log('Available methods:', Object.getOwnPropertyNames(Object.getPrototypeOf(component)));
                }
                
            } catch (error) {
                updateStatus(`ERROR: ${error.message}`, false);
                console.error('Test error:', error);
            }
        }
        
        // Run test when page loads
        document.addEventListener('DOMContentLoaded', () => {
            setTimeout(testComponent, 500);
        });
    </script>
</body>
</html>
